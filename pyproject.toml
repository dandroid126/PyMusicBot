[project]
name = "pymusicbot"
version = "0.1.0"
description = "A self-hosted Discord music bot with local file playback, rewritten from JMusicBot"
readme = "README.md"
requires-python = ">=3.12"
# Allowed ranges. The exact, tested versions are pinned in requirements.txt, which is
# generated from these by scripts/lock.sh.
dependencies = [
    "discord.py[voice]>=2.7.1,<3",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
pymusicbot = "pymusicbot.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Inside discord.py (utils.escape_markdown), not our code.
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord",
    # discord.py uses the standard library's audioop on Python 3.12 (audioop-lts on 3.13+).
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
