[project]
name = "pymusicbot"
version = "0.1.0"
description = "A self-hosted Discord music bot with local file playback, rewritten from JMusicBot"
readme = "README.md"
requires-python = ">=3.12"
# Allowed ranges. Exact versions live in uv.lock (and the requirements files exported from it);
# see scripts/lock.sh.
dependencies = [
    "discord.py[voice]>=2.7.1,<3",
    "yt-dlp[default]>=2026.8.19",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pymusicbot = "pymusicbot.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Inside discord.py (utils.escape_markdown), not our code.
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord",
]
