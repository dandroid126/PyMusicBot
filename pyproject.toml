[project]
name = "pymusicbot"
version = "0.1.0"
description = "A self-hosted Discord music bot with local file playback, rewritten from JMusicBot"
readme = "README.md"
requires-python = ">=3.12"
# Allowed ranges. The exact, tested versions are pinned in requirements.txt, which is
# generated from these by scripts/lock.sh.
dependencies = [
    "discord.py[voice]>=2.7.1,<3",
    # discord.py's voice encryption library. 0.1.7 is the first with Python 3.15 wheels. 0.2
    # changed how keys are switched, and discord.py 2.7.1 still uses the 0.1 way, so 0.2
    # waits until a discord.py release supports it (github.com/Rapptz/discord.py/pull/10548).
    "davey>=0.1.7,<0.2",
    "yt-dlp[default]>=2026.8.19",
    # The JavaScript runtime yt-dlp needs for YouTube, so owners don't install it themselves.
    "deno>=2.3",
]

[project.scripts]
pymusicbot = "pymusicbot.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Inside discord.py (utils.escape_markdown), not our code.
    "ignore:'count' is passed as positional argument:DeprecationWarning:discord",
    # discord.py uses the standard library's audioop on Python 3.12 (audioop-lts on 3.13+).
    "ignore:'audioop' is deprecated:DeprecationWarning",
]
