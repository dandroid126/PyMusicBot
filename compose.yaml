# PyMusicBot with Docker Compose. Setup and updating: docs/deployment.md.
# A fixed name, so a copy in another folder replaces this container instead of adding one.
name: pymusicbot

services:
  pymusicbot:
    # Published by CI from main after the tests pass.
    image: ghcr.io/dandroid126/pymusicbot:latest
    env_file: .env
    volumes:
      # config.toml, read-only: the bot never writes to it.
      - ./config:/config:ro
      # settings.json, playlists, and serversettings.json when migrating from JMusicBot.
      - ./data:/data
      # Your music library, read-only. Set MUSIC_DIR in .env to point at it.
      - ${MUSIC_DIR:-./music}:/music:ro
    # No automatic restarts by default: the bot stays stopped after /shutdown, a crash, a setup
    # error or a reboot. To restart it after crashes, uncomment the line below. A setup error
    # such as a wrong token then restarts it over and over until fixed. For a bot that comes
    # back after reboots, see docs/deployment.md.
    # restart: on-failure
    # Hardening: the bot needs no special privileges, and writes only to /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
