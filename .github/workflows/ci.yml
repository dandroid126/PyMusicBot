name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      # The library tests run ffmpeg and ffprobe on real audio files. On Linux, Ubuntu's own
      # package is more reliable than setup-ffmpeg, which failed once reading its download
      # site's readme.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      # uv installs requirements.txt much faster than pip. It refuses pins that conflict (e.g. a
      # bad Dependabot bump), and uv pip check catches pyproject.toml ranges that
      # requirements.txt no longer satisfies (edited without running scripts/lock.sh).
      - run: uv pip install --system --require-hashes -r requirements.txt -r requirements-test.txt
      - run: uv pip install --system --no-deps .
      - run: uv pip check --system
      - run: python -m pytest -q

  pip-install:
    # Server owners install with plain pip, following docs/deployment.md (start.bat on Windows).
    # Each run ends with the bot logging in with a fake token read from .env, which Discord
    # refuses (exit code 2): the install worked, .env was read, and the bot started.
    name: pip install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: echo "DISCORD_TOKEN=not-a-real-token" > .env
        shell: bash
      - name: Install and start as in the guide (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements.txt
          .venv/bin/pip install --no-deps -e .
          .venv/bin/pip check
          code=0; .venv/bin/python -m pymusicbot > out.txt 2>&1 || code=$?
          cat out.txt
          grep -q "Discord rejected the token" out.txt && [ "$code" = 2 ]
      - name: Install and start with start.bat (Windows)
        if: runner.os == 'Windows'
        run: |
          cmd /c "start.bat > out.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content out.txt
          .venv\Scripts\python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($code -ne 2 -or -not (Select-String -Path out.txt -Pattern "Discord rejected the token" -Quiet)) { exit 1 }
          exit 0

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the tests in the test image
        run: |
          docker build --target test -t pymusicbot-test .
          docker run --rm pymusicbot-test
      - name: Build the runtime image
        run: docker build --target runtime -t pymusicbot .
