name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # The library tests run ffmpeg and ffprobe on real audio files.
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: python -m pip install ".[test]"
      - run: python -m pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the tests in the test image
        run: |
          docker build --target test -t pymusicbot-test .
          docker run --rm pymusicbot-test
      - name: Build the runtime image
        run: docker build --target runtime -t pymusicbot .
