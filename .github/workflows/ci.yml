name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"  # the uv that generated uv.lock; update together
          python-version: "3.14"
      # The library tests run ffmpeg and ffprobe on real audio files. On Linux, Ubuntu's own
      # package is more reliable than setup-ffmpeg, which failed once reading its download
      # site's readme.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
      # Exactly the versions in uv.lock (a Dependabot PR's new versions included).
      - run: uv sync --locked --extra test
      - run: uv run pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the tests in the test image
        run: |
          docker build --target test -t pymusicbot-test .
          docker run --rm pymusicbot-test
      - name: Build the runtime image
        run: docker build --target runtime -t pymusicbot .
