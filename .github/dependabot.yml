version: 2
updates:
  # Python packages in uv.lock. yt-dlp is checked daily and gets its own PR, because YouTube
  # changes often break older versions; everything else is grouped into one PR.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      yt-dlp:
        patterns: ["yt-dlp", "yt-dlp-ejs"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp", "yt-dlp-ejs"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
